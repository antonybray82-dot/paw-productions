<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jelly Bounce! | Paw Productions</title><style>*{box-sizing:border-box}body{margin:0;background:#21152d;color:#fff;font-family:system-ui,Arial,sans-serif;overflow:hidden;touch-action:none}#wrap{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}header{width:min(100%,960px);display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900;text-shadow:2px 3px #08030c}header strong{color:#efbbff;font-size:clamp(16px,3vw,25px)}header span{font-size:13px}canvas{display:block;width:min(100%,960px);height:auto;max-height:72dvh;aspect-ratio:16/9;border:5px solid #100a18;border-radius:15px;background:#f9edff;box-shadow:0 6px 0 #9d63bb;touch-action:none}#controls{display:flex;justify-content:space-between;width:min(100%,960px);gap:12px;user-select:none}#controls .group{display:flex;gap:12px}button{border:3px solid #130b19;border-radius:15px;background:#f2d0ff;color:#241030;font-weight:1000;font-size:21px;box-shadow:0 5px 0 #8e5aa7;min-width:75px;min-height:58px;touch-action:none}button:active,.down{transform:translateY(4px);box-shadow:0 1px 0 #8e5aa7}#jump{background:#ffec9a}#start{background:#c4ffda;font-size:16px}footer{font-size:12px;opacity:.8;text-align:center}@media(max-height:600px){#wrap{gap:3px}canvas{max-height:65dvh}button{min-height:44px}footer{display:none}}</style></head><body><div id="wrap"><header><strong>🍬 JELLY BOUNCE!</strong><span id="hud">CRYSTALS 0 · LIVES ♥♥♥</span></header><canvas id="game" width="960" height="540" aria-label="Jelly Bounce platform game"></canvas><div id="controls"><div class="group"><button id="left" aria-label="Move left">◀</button><button id="right" aria-label="Move right">▶</button></div><div class="group"><button id="start">START / RESTART</button><button id="jump">BOING! ↑</button></div></div><footer>Move ◀ ▶ · Jump ↑ / Space · Crystals +100 points · Jelly SPLATS +50 points · Reach the portal!</footer></div><script>
(()=>{'use strict';const c=document.getElementById('game'),g=c.getContext('2d'),hud=document.getElementById('hud');const W=960,H=540,keys={left:false,right:false,jump:false};let state='menu',player,cam=0,score=0,crystalCount=0,splatCount=0,lives=3,frame=0,inv=0,particles=[],collected=new Set(),enemies=[],won=false,bonus=0,amosTaken=false;const AMOS_X=2770;const platforms=[{x:0,y:465,w:470},{x:525,y:425,w:230},{x:810,y:460,w:310},{x:1190,y:400,w:220},{x:1470,y:465,w:310},{x:1830,y:410,w:250},{x:2150,y:455,w:380},{x:2590,y:415,w:270},{x:2920,y:465,w:400},{x:3370,y:430,w:260},{x:3700,y:460,w:500}];const gems=[{x:180,y:388},{x:340,y:385},{x:610,y:350},{x:920,y:380},{x:1250,y:325},{x:1570,y:390},{x:1710,y:390},{x:1930,y:335},{x:2280,y:375},{x:2450,y:375},{x:2700,y:340},{x:3050,y:385},{x:3190,y:385},{x:3500,y:350},{x:3840,y:380}];const WORLD=4200;function reset(){player={x:65,y:360,w:42,h:60,vx:0,vy:0,on:false};cam=0;score=0;crystalCount=0;splatCount=0;lives=3;bonus=0;amosTaken=false;inv=0;frame=0;particles=[];collected=new Set();enemies=[{x:400,y:427,min:260,max:455,dir:1},{x:985,y:422,min:845,max:1090,dir:-1},{x:1610,y:427,min:1500,max:1740,dir:1},{x:2350,y:417,min:2190,max:2490,dir:-1},{x:3110,y:427,min:2960,max:3260,dir:1},{x:3920,y:422,min:3730,max:4140,dir:-1}];state='play';updateHUD()}function updateHUD(){hud.textContent='SCORE '+score+' · 💎 '+crystalCount+'/'+gems.length+' · 💥 '+splatCount+' · LIVES '+('♥'.repeat(Math.max(0,lives)))}function poly(points,fill,stroke='#21152d',lw=5){g.beginPath();g.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}function bubble(x,y,r,color){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=color;g.fill();g.lineWidth=4;g.strokeStyle='#23142d';g.stroke()}function txt(s,x,y,size=30,color='#24142c',align='center'){g.font=`1000 ${size}px system-ui,Arial`;g.textAlign=align;g.lineWidth=6;g.strokeStyle='#fff';g.strokeText(s,x,y);g.fillStyle=color;g.fillText(s,x,y)}function puff(x,y,word){for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-.5)*10,vy:-Math.random()*8-2,t:35,color:i%2?'#c078ed':'#fff3a6'});if(word)particles.push({x,y:y-22,vx:0,vy:-1.6,t:42,word})}function drawBg(){g.fillStyle='#f9e8ff';g.fillRect(0,0,W,H);for(let i=0;i<14;i++){let x=((i*305-cam*.2)%1250+1250)%1250-140,y=55+(i*59)%195;g.fillStyle='#fff';g.strokeStyle='#b79ac9';g.lineWidth=3;g.beginPath();g.ellipse(x,y,60,23,0,0,Math.PI*2);g.ellipse(x+45,y-10,44,30,0,0,Math.PI*2);g.fill();g.stroke()}for(let i=0;i<16;i++){let x=((i*320-cam*.45)%1550+1550)%1550-160;g.strokeStyle='#25182c';g.lineWidth=8;g.beginPath();g.moveTo(x,390);g.lineTo(x,240+(i%3)*32);g.stroke();bubble(x,228+(i%3)*32,38,i%2?'#e1b0ff':'#f8a9d0');g.lineWidth=3;g.strokeStyle='#fff';g.beginPath();g.arc(x-12,214+(i%3)*32,10,3.2,5.3);g.stroke()}g.fillStyle='#e4b6ef';g.beginPath();g.moveTo(0,480);for(let x=0;x<=W;x+=20)g.lineTo(x,410+Math.sin((x+cam*.13)/105)*35);g.lineTo(W,H);g.lineTo(0,H);g.fill()}function drawPlatforms(){for(const p of platforms){const x=p.x-cam;if(x+p.w<0||x>W)continue;g.fillStyle='#f5c5ec';g.strokeStyle='#281831';g.lineWidth=6;g.beginPath();g.roundRect(x,p.y,p.w,H-p.y+70,24);g.fill();g.stroke();g.fillStyle='#fff8ff';g.beginPath();g.roundRect(x-5,p.y-12,p.w+10,38,20);g.fill();g.stroke();g.strokeStyle='#d18bca';g.lineWidth=3;for(let k=30;k<p.w;k+=65){g.beginPath();g.arc(x+k,p.y+50,8,0,Math.PI);g.stroke()}}}function drawGems(){gems.forEach((gem,i)=>{if(collected.has(i))return;const x=gem.x-cam;if(x<-30||x>W+30)return;const y=gem.y+Math.sin(frame*.07+i)*8;poly([[x,y-25],[x+20,y-8],[x+13,y+18],[x,y+30],[x-13,y+18],[x-20,y-8]],'#a34de4');poly([[x,y-25],[x+5,y-8],[x,y+30],[x-13,y+18],[x-20,y-8]],'#e9b8ff',null);g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(x+5,y-18);g.lineTo(x+12,y-9);g.stroke()})}function drawEnemy(e){let x=e.x-cam,y=e.y+Math.sin(frame*.1+e.x)*3;bubble(x,y,24,'#bd80e8');bubble(x-8,y-6,4,'#fff');bubble(x+8,y-6,4,'#fff');bubble(x-7,y-6,2,'#22132a');bubble(x+9,y-6,2,'#22132a');g.strokeStyle='#21152d';g.lineWidth=3;g.beginPath();g.arc(x,y+6,9,0,Math.PI);g.stroke()}function drawPlayer(){let x=player.x-cam,y=player.y;if(inv>0&&Math.floor(frame/5)%2)return;g.strokeStyle='#21152d';g.lineWidth=5;g.fillStyle='#a0a9d8';g.beginPath();g.roundRect(x+4,y+27,35,34,8);g.fill();g.stroke();g.fillStyle='#f9e5cd';g.beginPath();g.arc(x+22,y+17,18,0,Math.PI*2);g.fill();g.stroke();g.fillStyle='#3c2442';g.beginPath();g.arc(x+21,y+3,18,Math.PI,Math.PI*2);g.fill();g.stroke();g.fillStyle='#21152d';g.beginPath();g.arc(x+15,y+17,2.8,0,7);g.arc(x+29,y+17,2.8,0,7);g.fill();g.strokeStyle='#21152d';g.lineWidth=4;g.beginPath();g.moveTo(x+7,y+57);g.lineTo(x+4,y+64);g.moveTo(x+34,y+57);g.lineTo(x+39,y+64);g.stroke();g.fillStyle='#f9edff';g.fillRect(x+14,y+36,14,11);txt('★',x+21,y+46,12,'#8d46b6')}function drawShip(){
 // Nova's ship flies overhead at intervals, in bold comic-book style.
 const phase=(frame+90)%720;if(phase>240)return;
 const x=1050-phase*5.8,y=92+Math.sin(phase*.055)*14;
 g.save();g.translate(x,y);g.rotate(-.07);
 poly([[-100,0],[-48,-19],[15,-22],[85,0],[15,20],[-48,18]],'#b7a5d6','#21152d',5);
 poly([[-25,-13],[16,-44],[50,-37],[38,-7]],'#9158c6','#21152d',4);
 poly([[-20,13],[22,38],[53,31],[36,8]],'#7e47b2','#21152d',4);
 bubble(20,0,12,'#f5dcff');
 poly([[-98,-11],[-145,0],[-98,11]],'#ffd966','#21152d',3);
 g.restore();if(phase>28&&phase<185&&phase%85<22)txt('WHOOOOSH!',x-100,y-56,23,'#8038b6');
}
function drawAmos(){if(amosTaken)return;const x=AMOS_X-cam;if(x<-80||x>W+80)return;
 const y=350+Math.sin(frame*.06)*5;
 g.save();g.translate(x,y);
 // Little grey miniature Schnauzer with distinctive beard and eyebrows.
 g.strokeStyle='#21152d';g.lineWidth=4;
 g.fillStyle='#9fa2ae';g.beginPath();g.ellipse(0,15,29,21,0,0,Math.PI*2);g.fill();g.stroke();
 for(const ex of [-19,19]){g.fillStyle='#777d8c';g.beginPath();g.moveTo(ex,-1);g.lineTo(ex*1.6,-32);g.lineTo(ex*.45,-24);g.closePath();g.fill();g.stroke()}
 g.fillStyle='#bfc1c8';g.beginPath();g.ellipse(0,-9,24,24,0,0,Math.PI*2);g.fill();g.stroke();
 for(const ex of [-10,10]){g.fillStyle='#fff';g.beginPath();g.ellipse(ex,-14,8,6,0,0,Math.PI*2);g.fill();g.stroke();bubble(ex,-12,2,'#21152d')}
 g.fillStyle='#eee';g.beginPath();g.ellipse(0,5,15,12,0,0,Math.PI*2);g.fill();g.stroke();bubble(0,-1,5,'#21152d');
 g.restore();txt('AMOS! +1 LIFE',x,y-53,19,'#7433a5');
}
function drawPortal(){let x=4090-cam;if(x<-90||x>W+100)return;g.save();g.translate(x,350);g.rotate(Math.sin(frame*.02)*.04);g.strokeStyle='#2b1536';g.lineWidth=8;g.fillStyle='#bb7ae7';g.beginPath();g.ellipse(0,0,53,94,0,0,Math.PI*2);g.fill();g.stroke();for(let i=0;i<4;i++){g.strokeStyle=['#fff','#803ac0','#ebc7ff','#ad52e1'][i];g.lineWidth=8-i;g.beginPath();g.ellipse(0,0,44-i*10,80-i*16,frame*.018+i,0,Math.PI*2);g.stroke()}g.restore();txt('FINISH!',x,225,25)}function damage(){if(inv)return;lives--;inv=95;puff(player.x+20-cam,player.y,'SPLAT!');updateHUD();if(lives<=0){state='over';return}player.x=Math.max(60,player.x-120);player.y=260;player.vy=-3}function tick(){frame++;if(state!=='play')return;let oldBottom=player.y+player.h;let fallingBeforeCollision=player.vy>0;player.vx=(keys.right?5.2:0)-(keys.left?5.2:0);player.x=Math.max(0,Math.min(WORLD-50,player.x+player.vx));if(keys.jump&&player.on){player.vy=-15.5;player.on=false;puff(player.x+20-cam,player.y+55,'BOING!')}player.vy=Math.min(16,player.vy+.72);player.y+=player.vy;player.on=false;for(const p of platforms){if(player.vy>=0&&player.x+player.w>p.x+5&&player.x<p.x+p.w-5&&oldBottom<=p.y+15&&player.y+player.h>=p.y){player.y=p.y-player.h;player.vy=0;player.on=true}}if(player.y>H+100)damage();if(player.y>H+180){player.x=Math.max(50,player.x-250);player.y=200;player.vy=0}if(inv>0)inv--;cam=Math.max(0,Math.min(WORLD-W,player.x-260));gems.forEach((gem,i)=>{if(!collected.has(i)&&Math.abs(player.x+20-gem.x)<34&&Math.abs(player.y+30-gem.y)<50){collected.add(i);crystalCount++;score+=100;puff(gem.x-cam,gem.y,'+100');updateHUD()}});for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.x+=e.dir*1.7;if(e.x>e.max||e.x<e.min)e.dir*=-1;const overlapsX=player.x+player.w>e.x-23&&player.x<e.x+23;const overlapsY=player.y+player.h>e.y-23&&player.y<e.y+23;if(overlapsX&&overlapsY){const stomp=fallingBeforeCollision&&player.vy>0&&oldBottom<=e.y+9&&player.y+player.h>=e.y-20;if(stomp){enemies.splice(i,1);splatCount++;score+=50;updateHUD();player.y=e.y-23-player.h;player.vy=-12.5;player.on=false;puff(e.x-cam,e.y,'SPLAT! +50');}else{damage()}}}if(!amosTaken&&Math.abs(player.x+20-AMOS_X)<52&&Math.abs(player.y+30-350)<75){amosTaken=true;lives++;puff(AMOS_X-cam,330,'AMOS! +1 LIFE');updateHUD()}
if(player.x>4035){bonus=lives*200;score+=bonus;state='won';won=true;updateHUD();puff(player.x-cam,player.y,'LIFE BONUS!')}particles=particles.filter(p=>--p.t>0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;if(!p.word)p.vy+=.18}}function render(){drawBg();drawShip();drawPlatforms();drawGems();drawAmos();drawPortal();enemies.forEach(drawEnemy);drawPlayer();for(const p of particles){if(p.word){txt(p.word,p.x,p.y,26,'#7b28ad')}else{g.fillStyle=p.color;g.fillRect(p.x,p.y,7,7)}}if(state!=='play'){g.fillStyle='rgba(35,16,47,.77)';g.fillRect(0,0,W,H);txt(state==='menu'?'JELLY BOUNCE!':state==='won'?'YOU DID IT!':'OH, JELLY!',W/2,160,65,'#ad54db');txt(state==='menu'?'PLANET MARSHMALLOW':state==='won'?`Score ${score} · Life bonus +${bonus} · ${crystalCount} crystals · ${splatCount} splats!`:'The jelly monsters got you!',W/2,220,30);txt(state==='menu'?'SPLAT jellies, collect crystals, rescue Amos!' :'Press START to play again',W/2,280,23);txt('Tap START / RESTART below',W/2,350,26,'#ad54db')}}function loop(){tick();render();requestAnimationFrame(loop)}function bind(id,k){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;el.classList.add('down');try{el.setPointerCapture(e.pointerId)}catch{}});for(let t of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(t,()=>{keys[k]=false;el.classList.remove('down')})}bind('left','left');bind('right','right');bind('jump','jump');document.getElementById('start').addEventListener('click',reset);document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','a','d','w'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k==='arrowup'||k==='w'||k===' ')keys.jump=true;if(k==='enter'&&state!=='play')reset()});document.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false;if(k==='arrowup'||k==='w'||k===' ')keys.jump=false});reset();state='menu';loop()})();
</script></body></html>
